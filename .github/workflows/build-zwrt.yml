name: 构建 LuCI 主题 ZWRT

# 触发条件：推送到js分支、手动触发、PR到js分支
on:
  push:
    branches:
      - js
    paths:
      - '**/Makefile'
      - 'scripts/gen-opkg-index.py'
  pull_request:
    branches:
      - js
    paths:
      - '**/Makefile'
      - 'scripts/gen-opkg-index.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 \
            libarchive-tools

      - name: 执行构建脚本
        run: |
          chmod +x build_auto.sh  # 确保脚本可执行
          ./build_auto.sh  # 运行你的构建脚本

      - name: 上传IPK作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-zwrt-ipk
          path: |
            ${{ env.IPK_PATH }}
          retention-days: 90

      - name: 创建GitHub Release
        if: github.event_name != 'pull_request'  # PR时不创建Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZWRT 主题 ${{ env.RELEASE_TAG }}
          body: |
            ## 自动构建信息
            - 版本: ${{ env.RELEASE_TAG }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交哈希: ${{ github.sha }}
            - 主题 ipk: ${{ env.IPK_PATH }}
            - 依赖（自包含）: 单包内置壁纸下载、默认配色与设置界面，无需外部配置插件
            - opkg 软件源（添加后自动更新）: https://kuwinet.github.io/ZWRT-Theme/all
          files: |
            ${{ env.IPK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 用官方 OpenWrt 主线 SDK 构建 APK，并按主流架构生成 apk 软件源（供官方 25.x/主线 apk 固件）
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行 APK 构建脚本
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: 上传 APK 源产物
        uses: actions/upload-artifact@v4
        with:
          name: zwrt-apk-feed
          path: ${{ env.APK_FEED_DIR }}
          retention-days: 90

      - name: 创建 GitHub Release（APK）
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_RELEASE_TAG }}
          name: ZWRT 主题 ${{ env.APK_RELEASE_TAG }} (APK)
          body: |
            ## ZWRT 主题 APK 软件源（官方主线/25.x apk 固件）
            - 版本: ${{ env.APK_RELEASE_TAG }}
            - 架构目录: x86_64 / aarch64_cortex-a53 / aarch64_cortex-a72 / aarch64_cortex-a76 / aarch64_generic / arm_cortex-a7 / arm_cortex-a9 / mips_24kc / mipsel_24kc / riscv64_riscv64
            - APK 源（配置后 apk add 自动更新）: https://kuwinet.github.io/ZWRT-Theme/apk
          files: |
            ${{ env.APK_TAR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 把 ipk 生成 opkg 索引并部署到 GitHub Pages，作为可更新的软件源
  publish-pages:
    runs-on: ubuntu-latest
    needs: [build, build-apk]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 IPK 产物
        uses: actions/download-artifact@v4
        with:
          name: luci-theme-zwrt-ipk
          path: feeds/all

      - name: 下载 APK 源产物
        uses: actions/download-artifact@v4
        with:
          name: zwrt-apk-feed
          path: feeds/apk

      - name: 生成 opkg 软件源索引
        run: |
          python3 scripts/gen-opkg-index.py feeds/all
          ls -la feeds/all/
          echo "--- apk 源结构 ---"
          find feeds/apk -name packages.adb | sort

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: feeds

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
